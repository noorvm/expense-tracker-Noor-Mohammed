<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
    </head>
    <body>
        <h1>Expense Tracker</h1>
        <section>
            <div>
                <h2>current balance</h2>
                <p id="total-balance">0.00</p>
            </div>
            <div>
                <h2>total income</h2>
                <P id="total-income">0.00</P>
            </div>
            <div>
                <h2>total expense </h2>
                <p id="total-expense">0.00</p>
            </div>
        </section>
        <section>
            <button id="btn-add-income">add income</button>
            <button id="btn-add-expense">add expense</button>
            <div id="modal-container" class="modal hidden">
                <div class="modal-content">
                    <button id="btn-close-modal"> X Close</button><br />
                    <h2 id="modal-heading"> Add Transaction</h2>
                    <form id="transaction-form">
                        <input 
                            type="hidden" 
                            id="edit-id"
                            value=""
                        />
                        <input 
                            type="hidden"
                            id="transaction-type"
                            value="expense"
                        />
                        <label>Description</label>
                        <input 
                            type="text"
                            id="description"
                            placeholder="enter the purpose"
                        />
                        <label>Amount</label>
                        <input 
                            type="number"
                            id="amount"
                            step="0.01"
                            min="0.01"
                        />
                        <label>Date</label>
                        <input 
                            type="date"
                            id="date"
                        />
                        <label>Category</label>
                        <select id="expense-category" class="hidden">
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Rent & Bills">Rent & Bills</option>
                            <option value="other">other</option>
                        </select>
                        <select id="income-category" class="hidden">
                            <option value="Salary">Salary</option>
                            <option value="Investments">Investments</option>
                            <option value="other">other</option>
                        </select>
                        <button type="submit" id="submit-btn">Save</button>
                    </form>
                </div>
            </div>
        </section>
        <section>
            <h2>Transaction History<button id="analysis-btn">Analysis</button></h2>
            <ul id="transaction-list"></ul>
        </section>
        <!-- Analysis Modal -->
        <div id="analysis-modal-container" class="modal hidden">
          <div class="modal-content">
            <button type="button" id="btn-close-analysis">✕ Close</button>
            <h2>Monthly Expense Summary</h2>

            <div id="monthly-summary-container" style="margin-top: 16px;">
              <ul id="monthly-list" style="list-style: none; display: flex; flex-direction: column; gap: 8px;">
                <!-- Monthly breakdowns will be dynamically injected here -->
              </ul>
            </div>
          </div>
        </div>
        
        <script src="Script.js"></script>
    </body>
</html>
